[project]
name = "loclass-starter"
version = "0.1.0"
description = "Starter project for loclass documents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loclass>=0.1.0",
    "loclass-ldl>=0.1.0",
]

[project.optional-dependencies]
tlp = [
    "loclass-tlp>=0.1.0",
]

[project.scripts]
loclass-render = "core.tools.ldl_renderer:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.uv.sources]
loclass = { path = "../loclass-base", editable = true }
loclass-ldl = { path = "../loclass-ldl", editable = true }
loclass-tlp = { path = "../loclass-tlp", editable = true }

[tool.pytest.ini_options]
testpaths = [
    "core/tests",
]
pythonpath = [
    ".",
]
python_files = [
    "test_*.py",
]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
